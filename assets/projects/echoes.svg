<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d5deef"/>
    </pattern>
    <g id="sat" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="326" y="62" width="50" height="18" rx="1" fill="#dbe6fd"/>
      <rect x="424" y="62" width="50" height="18" rx="1" fill="#dbe6fd"/>
      <path d="M343 62 V80 M359 62 V80 M441 62 V80 M457 62 V80" stroke-width="1.5"/>
      <path d="M376 71 H386 M414 71 H424"/>
      <rect x="386" y="56" width="28" height="30" rx="3" fill="#ffffff"/>
      <path d="M390 86 Q400 100 410 86 Z" fill="#ffffff"/>
    </g>
  </defs>

  <rect width="800" height="300" fill="#f5f8ff"/>
  <rect width="800" height="300" fill="url(#grid)"/>

  <g fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Ocean -->
    <path d="M0 240 Q400 200 800 240 V300 H0 Z" fill="#dbe6fd" stroke="none"/>
    <path d="M0 240 Q400 200 800 240" stroke="#93b4f5"/>
    <g stroke="#93b4f5" stroke-width="1.5">
      <path d="M300 262 q8 -6 16 0 t16 0"/>
      <path d="M420 256 q8 -6 16 0 t16 0"/>
      <path d="M540 268 q8 -6 16 0 t16 0"/>
      <path d="M660 258 q8 -6 16 0 t16 0"/>
      <path d="M360 284 q8 -6 16 0 t16 0"/>
      <path d="M600 288 q8 -6 16 0 t16 0"/>
    </g>

    <!-- Coast -->
    <path d="M0 222 C 70 210, 170 206, 250 218 C 226 234, 210 262, 198 300 H0 Z" fill="#e2e8f0"/>

    <!-- Orbit -->
    <path d="M20 130 Q400 12 780 130" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 6"/>

    <!-- Voice links -->
    <path d="M138 112 L392 94" stroke="#2563eb" stroke-dasharray="6 6"/>
    <path d="M408 94 L626 158" stroke="#2563eb" stroke-dasharray="6 6"/>

    <!-- Control tower -->
    <path d="M122 214 L126 168 H138 L142 214 Z" fill="#ffffff"/>
    <path d="M112 168 L106 146 H158 L152 168 Z" fill="#dbe6fd"/>
    <path d="M110 157 H154" stroke-width="1.5"/>
    <rect x="112" y="138" width="40" height="8" rx="2" fill="#ffffff"/>
    <path d="M132 138 V120"/>
    <circle cx="132" cy="117" r="3.5" fill="#2563eb" stroke="none"/>

    <!-- Aircraft -->
    <g transform="translate(650 172) rotate(-8)">
      <path d="M5 -6 L-10 -40 L-2 -40 L20 -6 Z M5 6 L-10 40 L-2 40 L20 6 Z" fill="#ffffff"/>
      <path d="M-30 -6 L-40 -18 L-34 -18 L-24 -6 Z M-30 6 L-40 18 L-34 18 L-24 6 Z" fill="#ffffff"/>
      <path d="M-40 0 C-40 -5 -30 -6 -20 -6 L30 -6 C38 -6 44 -3 46 0 C44 3 38 6 30 6 L-20 6 C-30 6 -40 5 -40 0 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Satellites -->
  <use href="#sat" xlink:href="#sat"/>
  <use href="#sat" xlink:href="#sat" transform="translate(680 103) scale(0.55) translate(-400 -71)" opacity="0.55"/>

  <!-- Voice waveform badges -->
  <g fill="none" stroke-linecap="round">
    <rect x="236" y="89" width="60" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M250 100 V106 M258 96 V110 M266 93 V113 M274 97 V109 M282 100 V106" stroke="#2563eb" stroke-width="3"/>

    <rect x="487" y="112" width="60" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M501 123 V129 M509 119 V133 M517 116 V136 M525 120 V132 M533 123 V129" stroke="#2563eb" stroke-width="3"/>
  </g>
</svg>
