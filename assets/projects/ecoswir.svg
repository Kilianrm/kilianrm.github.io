<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d5deef"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="300" fill="#f5f8ff"/>
  <rect width="800" height="300" fill="url(#grid)"/>

  <g fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Web UI client -->
    <rect x="70" y="100" width="140" height="90" rx="6" fill="#ffffff"/>
    <rect x="80" y="110" width="120" height="70" rx="2" fill="#f5f8ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="88" y="118" width="54" height="54" rx="2" fill="#dbe6fd" stroke="none"/>
    <circle cx="115" cy="145" r="7" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M101 145 H108 M122 145 H129 M115 131 V138 M115 152 V159" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M152 124 H192 M152 140 H192 M152 156 H192" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="170" cy="124" r="4" fill="#2563eb" stroke="none"/>
    <circle cx="182" cy="140" r="4" fill="#2563eb" stroke="none"/>
    <circle cx="160" cy="156" r="4" fill="#2563eb" stroke="none"/>
    <rect x="152" y="164" width="40" height="9" rx="3" fill="#2563eb" stroke="none"/>
    <path d="M58 190 H222 L232 202 H48 Z" fill="#ffffff"/>

    <!-- Client-server link -->
    <path d="M238 150 C 292 150, 304 82, 364 82" stroke="#2563eb" stroke-dasharray="6 6"/>
    <circle cx="238" cy="150" r="4" fill="#2563eb" stroke="none"/>
    <circle cx="366" cy="82" r="4" fill="#2563eb" stroke="none"/>

    <!-- Microscope column and arm -->
    <rect x="540" y="50" width="18" height="214" rx="4" fill="#ffffff"/>
    <path d="M428 62 H540 V92 H428" fill="#ffffff"/>

    <!-- Camera + tube -->
    <rect x="382" y="26" width="36" height="20" rx="3" fill="#ffffff"/>
    <rect x="372" y="46" width="56" height="74" rx="6" fill="#ffffff"/>
    <path d="M372 72 H428"/>

    <!-- Objective -->
    <path d="M382 120 H418 L412 156 H388 Z" fill="#dbe6fd"/>
    <rect x="392" y="156" width="16" height="10" rx="2" fill="#1e293b"/>

    <!-- Focus axis -->
    <path d="M452 124 V166" stroke="#2563eb" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- Light cone + focal point -->
    <path d="M394 166 L370 208 H430 L406 166 Z" fill="#2563eb" fill-opacity="0.14" stroke="none"/>
    <path d="M400 168 V206" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 4"/>

    <!-- Sample / wafer -->
    <ellipse cx="400" cy="210" rx="72" ry="9" fill="#dbe6fd" stroke="#2563eb"/>
    <circle cx="400" cy="209" r="3.5" fill="#2563eb" stroke="none"/>

    <!-- Motorized XY stage -->
    <rect x="300" y="219" width="200" height="14" rx="3" fill="#ffffff"/>
    <path d="M330 233 V240 M470 233 V240"/>
    <rect x="282" y="240" width="236" height="10" rx="3" fill="#e2e8f0"/>
    <rect x="256" y="232" width="26" height="26" rx="4" fill="#ffffff"/>
    <circle cx="269" cy="245" r="5" fill="#dbe6fd"/>
    <rect x="518" y="232" width="18" height="26" rx="4" fill="#ffffff"/>
    <rect x="240" y="264" width="340" height="10" rx="3" fill="#e2e8f0"/>
    <path d="M330 288 H470" stroke="#2563eb" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- Output arrow -->
    <path d="M574 153 H598" stroke="#2563eb" marker-end="url(#arrow)"/>

    <!-- Focus map -->
    <rect x="606" y="77" width="152" height="152" rx="8" fill="#ffffff"/>
    <g stroke="none" fill="#2563eb">
      <rect x="614" y="85" width="24" height="24" rx="3" fill-opacity="0.12"/>
      <rect x="642" y="85" width="24" height="24" rx="3" fill-opacity="0.22"/>
      <rect x="670" y="85" width="24" height="24" rx="3" fill-opacity="0.32"/>
      <rect x="698" y="85" width="24" height="24" rx="3" fill-opacity="0.26"/>
      <rect x="726" y="85" width="24" height="24" rx="3" fill-opacity="0.16"/>

      <rect x="614" y="113" width="24" height="24" rx="3" fill-opacity="0.22"/>
      <rect x="642" y="113" width="24" height="24" rx="3" fill-opacity="0.42"/>
      <rect x="670" y="113" width="24" height="24" rx="3" fill-opacity="0.60"/>
      <rect x="698" y="113" width="24" height="24" rx="3" fill-opacity="0.48"/>
      <rect x="726" y="113" width="24" height="24" rx="3" fill-opacity="0.28"/>

      <rect x="614" y="141" width="24" height="24" rx="3" fill-opacity="0.32"/>
      <rect x="642" y="141" width="24" height="24" rx="3" fill-opacity="0.60"/>
      <rect x="670" y="141" width="24" height="24" rx="3" fill-opacity="0.90"/>
      <rect x="698" y="141" width="24" height="24" rx="3" fill-opacity="0.68"/>
      <rect x="726" y="141" width="24" height="24" rx="3" fill-opacity="0.38"/>

      <rect x="614" y="169" width="24" height="24" rx="3" fill-opacity="0.26"/>
      <rect x="642" y="169" width="24" height="24" rx="3" fill-opacity="0.48"/>
      <rect x="670" y="169" width="24" height="24" rx="3" fill-opacity="0.68"/>
      <rect x="698" y="169" width="24" height="24" rx="3" fill-opacity="0.52"/>
      <rect x="726" y="169" width="24" height="24" rx="3" fill-opacity="0.28"/>

      <rect x="614" y="197" width="24" height="24" rx="3" fill-opacity="0.16"/>
      <rect x="642" y="197" width="24" height="24" rx="3" fill-opacity="0.28"/>
      <rect x="670" y="197" width="24" height="24" rx="3" fill-opacity="0.38"/>
      <rect x="698" y="197" width="24" height="24" rx="3" fill-opacity="0.32"/>
      <rect x="726" y="197" width="24" height="24" rx="3" fill-opacity="0.18"/>
    </g>
    <path d="M626 97 H738 V125 H626 V153 H738 V181 H626 V209 H738" stroke="#1e293b" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 4"/>
  </g>
</svg>
